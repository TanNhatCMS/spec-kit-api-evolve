schema_version: "1.0"

extension:
  id: api-evolve
  name: API Evolve
  version: "1.0.1"
  description: "Managed API contract evolution — breaking-change detection, semver enforcement, deprecation orchestration, and lifecycle gates across REST, GraphQL, and gRPC."
  author: Quratulain-bilal
  repository: https://github.com/Quratulain-bilal/spec-kit-api-evolve
  homepage: https://github.com/Quratulain-bilal/spec-kit-api-evolve
  license: MIT

requires:
  speckit_version: ">= 0.4.0"

provides:
  commands:
    - name: "speckit.api-evolve.orchestrate"
      file: "commands/speckit.api-evolve.orchestrate.md"
    - name: "speckit.api-evolve.detect"
      file: "commands/speckit.api-evolve.detect.md"
    - name: "speckit.api-evolve.baseline"
      file: "commands/speckit.api-evolve.baseline.md"
    - name: "speckit.api-evolve.diff"
      file: "commands/speckit.api-evolve.diff.md"
    - name: "speckit.api-evolve.classify"
      file: "commands/speckit.api-evolve.classify.md"
    - name: "speckit.api-evolve.bump"
      file: "commands/speckit.api-evolve.bump.md"
    - name: "speckit.api-evolve.deprecate"
      file: "commands/speckit.api-evolve.deprecate.md"
    - name: "speckit.api-evolve.deprecation-status"
      file: "commands/speckit.api-evolve.deprecation-status.md"
    - name: "speckit.api-evolve.gate"
      file: "commands/speckit.api-evolve.gate.md"
    - name: "speckit.api-evolve.changelog"
      file: "commands/speckit.api-evolve.changelog.md"
    - name: "speckit.api-evolve.client-impact"
      file: "commands/speckit.api-evolve.client-impact.md"
    - name: "speckit.api-evolve.release"
      file: "commands/speckit.api-evolve.release.md"

hooks:
  after_specify:
    command: "speckit.api-evolve.detect"
    optional: true
    description: "Detect API contract files in the project and annotate the spec with the contract surface and current version."
  after_plan:
    command: "speckit.api-evolve.baseline"
    optional: true
    description: "Capture a baseline snapshot of every detected contract before any plan-driven changes are implemented."
  after_tasks:
    command: "speckit.api-evolve.diff"
    optional: true
    description: "Inject [API-*] tasks for any planned contract change — diff, classify, bump, deprecate — with dispatch trailers."
  before_implement:
    command: "speckit.api-evolve.gate"
    optional: true
    description: "Gate. Refuse to start implementation if a breaking change is undeclared, version not bumped, or deprecation policy unmet."
  after_implement:
    command: "speckit.api-evolve.diff"
    optional: true
    description: "Re-run diff against the post-implementation contract, write the changelog entry, and surface client-impact report."

tags:
  - api
  - contracts
  - versioning
  - openapi
  - graphql
  - grpc
  - deprecation
  - breaking-changes
  - semver
  - governance
